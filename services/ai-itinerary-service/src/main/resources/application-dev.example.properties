# application-dev.example.properties — TEMPLATE
# Copy to application-dev.properties and fill in your own local values.
# Do NOT commit real secrets.

server.port=8084

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/planmytrip_itinerary_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.hikari.pool-name=ItineraryServicePool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT — must match the value configured in user-service
jwt.secret=your_jwt_secret_key

# App
app.base-url=http://localhost:8084

# Gemini AI — get a key from https://aistudio.google.com/apikey
gemini.api-key=your_gemini_api_key

# Logging
logging.level.com.planmytrip=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always