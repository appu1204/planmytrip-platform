# application-dev.example.properties

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/planmytrip_trip_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.com.planmytrip=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
