# ==========================================

spring.cloud.gateway.server.webflux.routes[13].id=ai-itinerary-trips-itinerary-exact
spring.cloud.gateway.server.webflux.routes[13].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/trips/{tripId}/itinerary
spring.cloud.gateway.server.webflux.routes[13].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/itinerary, /api/v1/ai-itinerary/trips/$\{tripId}/itinerary


# ==========================================
# Route 14: AI Itinerary - /trips/{tripId}/budget
# ==========================================

spring.cloud.gateway.server.webflux.routes[14].id=ai-itinerary-trips-budget
spring.cloud.gateway.server.webflux.routes[14].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[14].predicates[0]=Path=/trips/{tripId}/budget
spring.cloud.gateway.server.webflux.routes[14].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/budget, /api/v1/ai-itinerary/trips/$\{tripId}/budget


# ==========================================
# Route 15: AI Itinerary - /trips/{tripId}/notes
# ==========================================

spring.cloud.gateway.server.webflux.routes[15].id=ai-itinerary-trips-notes
spring.cloud.gateway.server.webflux.routes[15].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[15].predicates[0]=Path=/trips/{tripId}/notes
spring.cloud.gateway.server.webflux.routes[15].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/notes, /api/v1/ai-itinerary/trips/$\{tripId}/notes


# ==========================================
# Route 16: AI Itinerary - /trips/{tripId}/route/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[16].id=ai-itinerary-trips-route
spring.cloud.gateway.server.webflux.routes[16].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[16].predicates[0]=Path=/trips/{tripId}/route/**
spring.cloud.gateway.server.webflux.routes[16].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/route(?<segment>.*), /api/v1/ai-itinerary/trips/$\{tripId}/route$\{segment}


# ==========================================
# Route 17: AI Itinerary - /trips/{tripId}/route
# ==========================================

spring.cloud.gateway.server.webflux.routes[17].id=ai-itinerary-trips-route-exact
spring.cloud.gateway.server.webflux.routes[17].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[17].predicates[0]=Path=/trips/{tripId}/route
spring.cloud.gateway.server.webflux.routes[17].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/route, /api/v1/ai-itinerary/trips/$\{tripId}/route


# ==========================================
# Route 18: Trip Service Route (Catch-all for trip-service)
# ==========================================

spring.cloud.gateway.server.webflux.routes[18].id=trip-service
spring.cloud.gateway.server.webflux.routes[18].uri=${trip.service.url}
spring.cloud.gateway.server.webflux.routes[18].predicates[0]=Path=/api/trip/**
spring.cloud.gateway.server.webflux.routes[18].filters[0]=StripPrefix=0


# ==========================================
# Route 19: Trip Service - /trips/** alias
# ==========================================

spring.cloud.gateway.server.webflux.routes[19].id=trip-service-trips-alias
spring.cloud.gateway.server.webflux.routes[19].uri=${trip.service.url}
spring.cloud.gateway.server.webflux.routes[19].predicates[0]=Path=/trips/**
spring.cloud.gateway.server.webflux.routes[19].filters[0]=RewritePath=/trips(?<segment>.*), /api/trip/trips$\{segment}


# ==========================================
# CORS Configuration
# ==========================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.onrender.com}
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST


# ==========================================
# HTTP Client
# ==========================================

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=60s


# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET:dev-planmytrip-secret-key-min-32-chars-ok-for-local}


# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info,gateway


# ==========================================
# Logging
# ==========================================

logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.route=INFO