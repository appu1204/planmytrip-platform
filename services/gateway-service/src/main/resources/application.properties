# ==========================================
# Gateway Service
# ==========================================

server.port=8080
spring.application.name=gateway-service
spring.profiles.active=prod


# ==========================================
# Service Base URIs
# ==========================================

user.service.url=${USER_SERVICE_URL}
trip.service.url=${TRIP_SERVICE_URL}
ai.itinerary.service.url=${AI_ITINERARY_SERVICE_URL}


# ==========================================
# User Service Route
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${user.service.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/user/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=0


# ==========================================
# Trip Service Route
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=trip-service
spring.cloud.gateway.server.webflux.routes[1].uri=${trip.service.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/trip/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=0


# ==========================================
# Users Alias
# ==========================================

spring.cloud.gateway.server.webflux.routes[2].id=user-service-users-alias
spring.cloud.gateway.server.webflux.routes[2].uri=${user.service.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/users/(?<segment>.*), /api/user/users/$\{segment}


# ==========================================
# AI Itinerary - /itineraries/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[3].id=ai-itinerary-service-itineraries-alias
spring.cloud.gateway.server.webflux.routes[3].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/itineraries/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/itineraries/(?<segment>.*), /api/v1/ai-itinerary/$\{segment}


# ==========================================
# AI Itinerary - /api/itinerary/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[4].id=ai-itinerary-service-api-itinerary-alias
spring.cloud.gateway.server.webflux.routes[4].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/itinerary/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/itinerary/(?<segment>.*), /api/v1/ai-itinerary/$\{segment}


# ==========================================
# AI Itinerary - Direct
# ==========================================

spring.cloud.gateway.server.webflux.routes[5].id=ai-itinerary-service
spring.cloud.gateway.server.webflux.routes[5].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/ai-itinerary/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=0


# ==========================================
# AI Itinerary - Trip Itinerary
# ==========================================

spring.cloud.gateway.server.webflux.routes[6].id=ai-itinerary-trips-itinerary-sub
spring.cloud.gateway.server.webflux.routes[6].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/trips/{tripId}/itinerary/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/itinerary(?<segment>.*), /api/v1/ai-itinerary/trips/$\{tripId}/itinerary$\{segment}


spring.cloud.gateway.server.webflux.routes[7].id=ai-itinerary-trips-itinerary-exact
spring.cloud.gateway.server.webflux.routes[7].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/trips/{tripId}/itinerary
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/itinerary, /api/v1/ai-itinerary/trips/$\{tripId}/itinerary


# ==========================================
# AI Itinerary - Budget
# ==========================================

spring.cloud.gateway.server.webflux.routes[8].id=ai-itinerary-trips-budget
spring.cloud.gateway.server.webflux.routes[8].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/trips/{tripId}/budget
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/budget, /api/v1/ai-itinerary/trips/$\{tripId}/budget


# ==========================================
# AI Itinerary - Notes
# ==========================================

spring.cloud.gateway.server.webflux.routes[9].id=ai-itinerary-trips-notes
spring.cloud.gateway.server.webflux.routes[9].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/trips/{tripId}/notes
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/notes, /api/v1/ai-itinerary/trips/$\{tripId}/notes


# ==========================================
# AI Itinerary - Route
# ==========================================

spring.cloud.gateway.server.webflux.routes[10].id=ai-itinerary-trips-route
spring.cloud.gateway.server.webflux.routes[10].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/trips/{tripId}/route/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/route(?<segment>.*), /api/v1/ai-itinerary/trips/$\{tripId}/route$\{segment}


spring.cloud.gateway.server.webflux.routes[11].id=ai-itinerary-trips-route-exact
spring.cloud.gateway.server.webflux.routes[11].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/trips/{tripId}/route
spring.cloud.gateway.server.webflux.routes[11].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/route, /api/v1/ai-itinerary/trips/$\{tripId}/route


# ==========================================
# Trip Service - /trips/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[12].id=trip-service-trips-alias
spring.cloud.gateway.server.webflux.routes[12].uri=${trip.service.url}
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/trips/**
spring.cloud.gateway.server.webflux.routes[12].filters[0]=RewritePath=/trips(?<segment>.*), /api/trip/trips$\{segment}


# ==========================================
# CORS Header Deduplication
# ==========================================

spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST


# ==========================================
# HTTP Client
# ==========================================

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=60s


# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}


# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info,gateway


# ==========================================
# Logging
# ==========================================

logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.gateway.route=INFO