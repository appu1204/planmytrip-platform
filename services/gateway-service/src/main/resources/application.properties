# ==========================================
# Gateway Service
# ==========================================

server.port=${PORT:8080}
spring.application.name=gateway-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ==========================================
# Service Base URIs
# ==========================================

user.service.url=${USER_SERVICE_URL:http://user-service:8081}
trip.service.url=${TRIP_SERVICE_URL:http://trip-service:8082}
ai.itinerary.service.url=${AI_ITINERARY_SERVICE_URL:http://ai-itinerary-service:8083}


# ==========================================
# Route 0: User Service
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${user.service.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/user/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=0


# ==========================================
# Route 1: Users Alias
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=user-service-users-alias
spring.cloud.gateway.server.webflux.routes[1].uri=${user.service.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/users/(?<segment>.*), /api/user/users/$\{segment}


# ==========================================
# Route 2: AI Itinerary - /api/trip/itineraries/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[2].id=ai-itinerary-api-trip-itineraries
spring.cloud.gateway.server.webflux.routes[2].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/trip/itineraries/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/api/trip/itineraries/(?<segment>.*), /api/v1/ai-itinerary/$\{segment}


# ==========================================
# Route 3: AI Itinerary - /api/trip/trips/{tripId}/itinerary/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[3].id=ai-itinerary-api-trip-itinerary-sub
spring.cloud.gateway.server.webflux.routes[3].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/trip/trips/{tripId}/itinerary/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/api/trip/trips/(?<tripId>[^/]+)/itinerary(?<segment>.*), /api/v1/ai-itinerary/trips/$\{tripId}/itinerary$\{segment}


# ==========================================
# Route 4: AI Itinerary - /api/trip/trips/{tripId}/itinerary
# ==========================================

spring.cloud.gateway.server.webflux.routes[4].id=ai-itinerary-api-trip-itinerary-exact
spring.cloud.gateway.server.webflux.routes[4].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/trip/trips/{tripId}/itinerary
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/trip/trips/(?<tripId>[^/]+)/itinerary, /api/v1/ai-itinerary/trips/$\{tripId}/itinerary


# ==========================================
# Route 5: AI Itinerary - /api/trip/trips/{tripId}/budget
# ==========================================

spring.cloud.gateway.server.webflux.routes[5].id=ai-itinerary-api-trip-budget
spring.cloud.gateway.server.webflux.routes[5].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/trip/trips/{tripId}/budget
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/api/trip/trips/(?<tripId>[^/]+)/budget, /api/v1/ai-itinerary/trips/$\{tripId}/budget


# ==========================================
# Route 6: AI Itinerary - /api/trip/trips/{tripId}/notes
# ==========================================

spring.cloud.gateway.server.webflux.routes[6].id=ai-itinerary-api-trip-notes
spring.cloud.gateway.server.webflux.routes[6].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/trip/trips/{tripId}/notes
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/api/trip/trips/(?<tripId>[^/]+)/notes, /api/v1/ai-itinerary/trips/$\{tripId}/notes


# ==========================================
# Route 7: AI Itinerary - /api/trip/trips/{tripId}/route/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[7].id=ai-itinerary-api-trip-route
spring.cloud.gateway.server.webflux.routes[7].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/trip/trips/{tripId}/route/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/api/trip/trips/(?<tripId>[^/]+)/route(?<segment>.*), /api/v1/ai-itinerary/trips/$\{tripId}/route$\{segment}


# ==========================================
# Route 8: AI Itinerary - /api/trip/trips/{tripId}/route
# ==========================================

spring.cloud.gateway.server.webflux.routes[8].id=ai-itinerary-api-trip-route-exact
spring.cloud.gateway.server.webflux.routes[8].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/trip/trips/{tripId}/route
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/api/trip/trips/(?<tripId>[^/]+)/route, /api/v1/ai-itinerary/trips/$\{tripId}/route


# ==========================================
# Route 9: AI Itinerary - /itineraries/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[9].id=ai-itinerary-service-itineraries-alias
spring.cloud.gateway.server.webflux.routes[9].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/itineraries/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=RewritePath=/itineraries/(?<segment>.*), /api/v1/ai-itinerary/$\{segment}


# ==========================================
# Route 10: AI Itinerary - /api/itinerary/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[10].id=ai-itinerary-service-api-itinerary-alias
spring.cloud.gateway.server.webflux.routes[10].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/itinerary/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=RewritePath=/api/itinerary/(?<segment>.*), /api/v1/ai-itinerary/$\{segment}


# ==========================================
# Route 11: AI Itinerary - /api/v1/ai-itinerary/** Direct
# ==========================================

spring.cloud.gateway.server.webflux.routes[11].id=ai-itinerary-service
spring.cloud.gateway.server.webflux.routes[11].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/api/v1/ai-itinerary/**
spring.cloud.gateway.server.webflux.routes[11].filters[0]=StripPrefix=0


# ==========================================
# Route 12: AI Itinerary - /trips/{tripId}/itinerary/**
# ==========================================

spring.cloud.gateway.server.webflux.routes[12].id=ai-itinerary-trips-itinerary-sub
spring.cloud.gateway.server.webflux.routes[12].uri=${ai.itinerary.service.url}
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/trips/{tripId}/itinerary/**
spring.cloud.gateway.server.webflux.routes[12].filters[0]=RewritePath=/trips/(?<tripId>[^/]+)/itinerary(?<segment>.*), /api/v1/ai-itinerary/trips/$\{tripId}/itinerary$\{segment}


# ==========================================
