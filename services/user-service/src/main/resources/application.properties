
# application.properties — BASE CONFIG


spring.application.name=user-service
spring.profiles.active=dev

# Server
server.port=8081
server.servlet.context-path=/api/user

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Security
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=30

# Token Expiry
app.token.password-reset-expiry-minutes=15
app.token.email-verification-expiry-hours=24
app.token.otp-expiry-minutes=5

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.root=INFO

# Actuator
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true
