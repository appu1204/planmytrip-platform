server.port=${PORT:8081}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:planmytrip_user_db}?sslMode=PREFERRED&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=UserServicePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
app.jwt.secret=${JWT_SECRET:dev-planmytrip-secret-key-min-32-chars-ok-for-local}
app.jwt.expiration-ms=86400000

# URLs
app.base-url=${GATEWAY_URL:http://localhost:8080}/api/user
app.frontend-url=${FRONTEND_URL:https://planmytrip-frontend.onrender.com}

# Mail
spring.mail.username=${MAIL_USERNAME:noreply.planmytrip@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}

# Logging
logging.level.root=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never