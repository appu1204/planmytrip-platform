# application-dev.example.properties

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/planmytrip_user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password

spring.datasource.hikari.pool-name=UserServicePool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=your_jwt_secret_key
app.jwt.expiration-ms=900000

app.base-url=http://localhost:8080/api/user
app.frontend-url=http://localhost:5173
app.token.otp-expiry-minutes=5

spring.mail.username=your_email@gmail.com
spring.mail.password=your_email_app_password

spring.ai.google.genai.api-key=your_gemini_api_key

logging.level.com.planmytrip=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always