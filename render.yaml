# Render Blueprint Specification for PlanMyTrip Backend Platform
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: planmytrip-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://*.onrender.com
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        value: noreply.planmytrip@gmail.com
      - key: MAIL_PASSWORD
        sync: false
